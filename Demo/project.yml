name: ReportDemo
options:
  bundleIdPrefix: com.billdonner
  deploymentTarget:
    iOS: "17.0"
packages:
  ReportKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: NEAY582ME4
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  ReportDemo:
    type: application
    platform: iOS
    sources: [ReportDemo]
    dependencies:
      - package: ReportKit
  ReportDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReportDemoUITests]
    dependencies:
      - target: ReportDemo
